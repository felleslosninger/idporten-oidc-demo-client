---
spring:
  application:
    environment: test

oidc-demo-client:
  static:
    resources:
      host: https://static.test.idporten.no
  theme:
    heading: Login with ID-porten (test)
  oidc-integration:
    issuer: https://test.idporten.no
    client-id: democlient_idporten_test
    client-auth-method: client_secret_basic
    client-secret: ${OIDC_DEMO_CLIENT_SECRET}
    redirect-uri: https://demo-client.test.idporten.no/callback
    post-logout-redirect-uri: https://demo-client.test.idporten.no/logout/callback
  csp-header:
    - "default-src 'self';"
    - "img-src 'self' data:;"
    - "font-src 'self' static.test.idporten.no altinncdn.no;"
    - "style-src 'self' cdn.jsdelivr.net static.test.idporten.no altinncdn.no;"
    - "connect-src 'self' cdn.jsdelivr.net static.test.idporten.no altinncdn.no;"
    - "form-action 'self' login.test.idporten.no;"
    - "script-src 'self' static.test.idporten.no;"
